name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, version sync, and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Requires package-lock.json to be tracked (see .gitignore).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The service worker only busts its cache when CACHE_VERSION changes, and
      # that version is repeated in five files. Failing here is far cheaper than
      # shipping stale JS to installed users.
      - name: Verify version stamps are in sync
        run: npm run version:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
